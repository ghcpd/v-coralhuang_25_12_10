<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F1 Season Results</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1>F1 Season Results</h1>
      <p class="lead">Select a year → view rounds → view race results.</p>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <label for="yearSelect" class="label">Year</label>
        <select id="yearSelect" size="5" aria-label="Year selection"></select>
      </aside>

      <main class="content">
        <section class="panel">
          <h2>Rounds <span id="seasonLabel"></span></h2>
          <div class="table-wrap">
            <table id="roundsTable" class="table">
              <thead>
                <tr><th>Round</th><th>Race</th><th>Date</th><th>Circuit</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section class="panel results-panel">
          <h2>Race Results</h2>
          <div id="resultsContainer" class="results-container">Select a round to load results.</div>
        </section>
      </main>
    </div>

    <footer class="footer">Data provided by the Ergast API (via api.jolpi.ca). Internet connection required.</footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
